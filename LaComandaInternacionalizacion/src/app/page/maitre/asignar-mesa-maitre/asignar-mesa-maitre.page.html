
<header class="header header-nuevos-clientes">
  <h1 class="title">ASIGNAR MESA</h1>
</header>

<main class="home-supervisor-page">

  <div class="card-list-container">
    <ion-card class="menu-card" *ngFor="let mesa of mesas">
      <ion-card-header>
        <ion-card-title> MESA {{ mesa.numero }}</ion-card-title>
      </ion-card-header>

      <ion-card-content class="cliente-card-content">
        <div class="cliente-info">
          <p><strong>Descripción:</strong> {{ mesa.descripcion }}</p>
          <p><strong>Capacidad:</strong> {{ mesa.capacidad || 'No disponible' }}</p>
          <p><strong>Apta bebés:</strong> {{ mesa.aptaBebes ? 'Sí' : 'No' }}</p>
          <p><strong>Ubicación:</strong> {{ mesa.ubicacion || 'No disponible' }}</p>
        </div>

        <div class="cliente-actions">
          <ion-button class="asignar-btn"
            [disabled]="mesa.estado === 1"
            (click)="asignarClienteMesa(cliente!, mesa)">
            {{ mesa.estado === 1 ? 'Ocupada' : 'Asignar Mesa' }}
</ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div> <!-- <-- Cierra card-list-container -->
    <div *ngIf="isLoading" class="custom-spinner">
    <img src="../../../assets/icon/favicon.svg" alt="Cargando..." />
  </div>
</main>
