<header class="header header-preguntas-mozo">
  <h1 class="title">{{ 'PREGUNTAS_MOZO.TITLE' | translate }}</h1>
</header>
<main class="preguntas-mozo-page">

  <ion-card *ngIf="!isLoading && preguntas.length === 0" class="no-products-card">
    <ion-card-header>
      <ion-card-title>{{ 'PREGUNTAS_MOZO.NO_QUESTIONS' | translate }}</ion-card-title>
    </ion-card-header>
  </ion-card>

  <div *ngFor="let p of preguntas" class="card-respuesta">
    <p><strong>{{ 'PREGUNTAS_MOZO.TABLE_LABEL' | translate }}</strong> {{ p.mesa }}</p>
    <p><strong>{{ 'PREGUNTAS_MOZO.QUESTION_LABEL' | translate }}</strong> {{ p.pregunta }}</p>

    <form (ngSubmit)="responder(p.id)" class="form-responder">
      <ion-item class="input-card" lines="none">
        <ion-input [(ngModel)]="p.respuestaTemp" [name]="'respuesta_' + p.id" [placeholder]="'PREGUNTAS_MOZO.ANSWER_PLACEHOLDER' | translate"
          (ionInput)="p.respuestaTemp = $event.target.value">
        </ion-input>
      </ion-item>
      <ion-button expand="full" type="submit" class="btn-responder">{{ 'PREGUNTAS_MOZO.REPLY_BUTTON' | translate }}</ion-button>
    </form>
  </div>
  <div *ngIf="isLoading" class="custom-spinner">
    <img src="../../../assets/icon/favicon.svg" [attr.alt]="'COMMON.LOADING' | translate" />
  </div>
</main>
