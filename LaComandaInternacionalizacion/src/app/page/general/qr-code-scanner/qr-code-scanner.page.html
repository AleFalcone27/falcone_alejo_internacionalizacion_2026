<ion-content>
  <div class="scanner-container">

    <div class="top-spacer"></div>

    <div class="camera-status">
      <p *ngIf="isInitializing">{{ 'QR_CODE_SCANNER.INITIALIZING_CAMERA' | translate }}</p>
      <p *ngIf="isScanning">{{ 'QR_CODE_SCANNER.SCANNING_HINT' | translate }}</p>
      <p *ngIf="!cameraPreviewActive && !isInitializing">{{ 'QR_CODE_SCANNER.CAMERA_DISABLED' | translate }}</p>
    </div>

  </div>
</ion-content>
