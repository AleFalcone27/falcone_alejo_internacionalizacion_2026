<header class="header header-nuevos-clientes">
  <h1 class="title">NUEVOS CLIENTES</h1>
</header>
<ion-button fill="clear" slot="end" class="logout-button" (click)="CerrarCesion()">
  Cerrar sesión
  <ion-icon slot="start" name="arrow-back"></ion-icon>
</ion-button>


<main class="home-supervisor-page">
  <!-- Logo centrado -->
  <div class="logo-container">
    <img src="../../../assets/icon/favicon.svg" alt="Logo" class="login-logo" />
  </div>

  <!-- Contenedor de botones -->
  <div class="button-list-container">
    <ion-button expand="block" class="full-button" (click)="navTo('/clientes-supervisor')"> CLIENTES</ion-button>
    <ion-button expand="block" class="full-button">MESAS</ion-button>
    <ion-button expand="block" class="full-button">RESERVA</ion-button>
    <ion-button expand="block" class="full-button">DELIVERY</ion-button>

  </div>
</main>
