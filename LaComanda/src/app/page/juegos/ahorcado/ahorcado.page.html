<ion-content class="ahorcado-page" fullscreen>
  <div class="ahorcado-container">
    <h2 class="titulo">¡Adiviná la palabra!</h2>

    <div class="palabra">
      <span *ngFor="let letra of palabraMostrada">{{ letra }}</span>
    </div>

    <div class="intentos">
      Intentos restantes: <strong>{{ intentosRestantes }}</strong>
    </div>

    <div class="teclado">
      <ion-button *ngFor="let letra of abecedario" class="tecla"
        [disabled]="letrasUsadas.includes(letra) || juegoTerminado" (click)="adivinar(letra)">
        {{ letra }}
      </ion-button>
    </div>

    <div class="modal-overlay" *ngIf="juegoTerminado">
      <div class="modal-card">
        <p *ngIf="gano" class="ganaste">¡Ganaste! 🎉</p>
        <p *ngIf="!gano" class="perdiste">
          Perdiste 😢<br><small>La palabra era:</small><br><strong>{{ palabra }}</strong>
        </p>
        <ion-button expand="block" (click)="reiniciarJuego()">Jugar otra vez</ion-button>
      </div>
    </div>
  </div>
</ion-content>
